<ion-content class="ion-padding auth-content" [fullscreen]="true">
  <div class="auth-wrap">
    <div class="auth-logo-tile">
      <img class="auth-logo" src="assets/logo/logo-monogram.png" alt="" />
    </div>
    <h1 class="auth-title">Split-Easy</h1>
    <p class="auth-subtitle">Gérez vos dépenses partagées.</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="field-card">
        <label class="field-card__label" for="login-email">Email</label>
        <ion-input
          id="login-email"
          type="email"
          autocomplete="email"
          formControlName="email"
          required
          class="field-card__input"
        ></ion-input>
      </div>

      <div class="field-card field-card--password">
        <label class="field-card__label" for="login-password">Mot de passe</label>
        <ion-input
          id="login-password"
          [type]="showPassword ? 'text' : 'password'"
          autocomplete="current-password"
          formControlName="motDePasse"
          required
          class="field-card__input"
        ></ion-input>
        <button
          type="button"
          class="password-toggle"
          [attr.aria-label]="showPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
          (click)="toggleShowPassword()"
        >
          <ion-icon
            [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"
            aria-hidden="true"
          ></ion-icon>
        </button>
      </div>

      <ion-button
        type="submit"
        expand="block"
        [disabled]="submitting"
        class="auth-submit"
      >
        {{ submitting ? 'Connexion…' : 'Se connecter' }}
      </ion-button>
    </form>

    <div class="auth-divider"><span>ou</span></div>

    <p class="auth-alt">
      Pas encore de compte ?
      <a routerLink="/auth/register">S'inscrire</a>
    </p>
  </div>

  <div class="auth-footer">
    <ion-icon name="shield-checkmark-outline" aria-hidden="true"></ion-icon>
    Connexion chiffrée · conforme RGPD
  </div>
</ion-content>
