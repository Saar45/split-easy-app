<ion-header>
  <ion-toolbar>
    <ion-title>Connexion</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="auth-wrap">
    <img class="auth-logo" src="assets/logo/logo.svg" alt="SplitEasy" />
    <h1 class="auth-title">Split-Easy</h1>
    <p class="auth-subtitle">Gérez vos dépenses partagées.</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form">
      <ion-item>
        <ion-input
          label="Email"
          labelPlacement="floating"
          type="email"
          autocomplete="email"
          formControlName="email"
          required
        ></ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          label="Mot de passe"
          labelPlacement="floating"
          [type]="showPassword ? 'text' : 'password'"
          autocomplete="current-password"
          formControlName="motDePasse"
          required
        ></ion-input>
        <button
          type="button"
          slot="end"
          class="password-toggle"
          [attr.aria-label]="showPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
          (click)="toggleShowPassword()"
        >
          <ion-icon
            [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"
            aria-hidden="true"
          ></ion-icon>
        </button>
      </ion-item>

      <ion-button
        type="submit"
        expand="block"
        [disabled]="submitting"
        class="auth-submit"
      >
        {{ submitting ? 'Connexion…' : 'Se connecter' }}
      </ion-button>
    </form>

    <p class="auth-alt">
      Pas encore de compte ?
      <a routerLink="/auth/register">S'inscrire</a>
    </p>
  </div>
</ion-content>
