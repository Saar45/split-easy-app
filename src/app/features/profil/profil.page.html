<ion-header>
  <ion-toolbar>
    <ion-title>Profil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- Profile card -->
  <div class="profile-card" *ngIf="user$ | async as user">
    <div class="profile-card__texture" aria-hidden="true"></div>
    <div class="profile-card__avatar" aria-hidden="true">
      {{ getInitials(user.prenom, user.nom) }}
    </div>
    <h2 class="profile-name">{{ user.prenom }} {{ user.nom }}</h2>
    <p class="profile-email">{{ user.email }}</p>
    <span class="profile-groups-pill" *ngIf="groupCount !== null">
      Membre de {{ groupCount }} {{ groupCount > 1 ? 'groupes' : 'groupe' }}
    </span>
  </div>

  <!-- Section Compte -->
  <p class="section-label">Compte</p>
  <div class="section-card">
    <button type="button" class="section-row" (click)="showComingSoon()" aria-label="Modifier le profil">
      <ion-icon name="person-outline" class="section-row__icon" aria-hidden="true"></ion-icon>
      <span class="section-row__label">Modifier le profil</span>
      <ion-icon name="chevron-forward-outline" class="section-row__chevron" aria-hidden="true"></ion-icon>
    </button>
    <button type="button" class="section-row" (click)="showComingSoon()" aria-label="Changer le mot de passe">
      <ion-icon name="lock-closed-outline" class="section-row__icon" aria-hidden="true"></ion-icon>
      <span class="section-row__label">Changer le mot de passe</span>
      <ion-icon name="chevron-forward-outline" class="section-row__chevron" aria-hidden="true"></ion-icon>
    </button>
  </div>

  <!-- Section RGPD -->
  <p class="section-label">
    Données personnelles <span class="rgpd-chip">RGPD</span>
  </p>
  <div class="section-card">
    <button type="button" class="section-row" (click)="exportMyData()" [disabled]="exporting" aria-label="Télécharger mes données">
      <ion-icon name="download-outline" class="section-row__icon section-row__icon--info" aria-hidden="true"></ion-icon>
      <span class="section-row__label">Télécharger mes données</span>
      <ion-spinner *ngIf="exporting" name="crescent" aria-label="Export en cours"></ion-spinner>
    </button>
    <button type="button" class="section-row section-row--danger" (click)="confirmDeleteAccount()" [disabled]="deleting" aria-label="Supprimer mon compte">
      <ion-icon name="trash-outline" class="section-row__icon" aria-hidden="true"></ion-icon>
      <span class="section-row__label">Supprimer mon compte</span>
      <ion-spinner *ngIf="deleting" name="crescent" aria-label="Suppression en cours"></ion-spinner>
    </button>
  </div>

  <!-- Section Préférences notifications -->
  <p class="section-label">Préférences notifications</p>
  <div class="section-card">
    <div class="section-row section-row--static">
      <ion-icon name="mail-outline" class="section-row__icon section-row__icon--muted" aria-hidden="true"></ion-icon>
      <span class="section-row__label">Notifications par email</span>
      <ion-toggle
        class="section-toggle"
        [checked]="preferences?.notifications_email ?? false"
        [disabled]="loading || !preferences"
        (ionChange)="togglePreference('notifications_email')"
        aria-label="Activer les notifications par email"
      ></ion-toggle>
    </div>
    <div class="section-row section-row--static">
      <ion-icon name="notifications-outline" class="section-row__icon section-row__icon--muted" aria-hidden="true"></ion-icon>
      <span class="section-row__label">Notifications push</span>
      <ion-toggle
        class="section-toggle"
        [checked]="preferences?.notifications_push ?? false"
        [disabled]="loading || !preferences"
        (ionChange)="togglePreference('notifications_push')"
        aria-label="Activer les notifications push"
      ></ion-toggle>
    </div>
  </div>

  <!-- Logout -->
  <button type="button" class="logout-btn" (click)="logout()" aria-label="Se déconnecter">
    <ion-icon name="log-out-outline" aria-hidden="true"></ion-icon>
    Se déconnecter
  </button>

  <p class="app-version">Split-Easy · v1.1.4</p>

</ion-content>
